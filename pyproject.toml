[project]
name = "shelly-hass"
version = "0.3.0"
description = "Home Assistant custom integration for bulk Shelly adoption"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
  "error:.*via_device.*:DeprecationWarning",
  "error:.*async_get_device.*:DeprecationWarning",
  "error:.*merge_connections.*:DeprecationWarning",
  "error:.*merge_identifiers.*:DeprecationWarning",
]
